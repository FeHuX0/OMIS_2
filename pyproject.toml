[project]
name = "energy-home"
version = "1.0.0"
description = "Учёт и анализ энергопотребления дома по лабораторной работе №1"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6>=6.8,<7", "tzdata>=2025.1"]

[project.scripts]
energy-home = "energy_home.app:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_home"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".venv", "docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
cache-dir = ".uv-cache"
